name: CI/CD Pipeline - SIMagang UGM

on:
  push:
    branches:
      - main
      - dev
      - 'feat/**'
      - 'feature/**'
  pull_request:
    branches:
      - main
      - dev

permissions:
  contents: read
  packages: write

jobs:
  test-backend:
    name: Test Backend (Laravel)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    env:
      APP_ENV: testing
      APP_KEY: ${{ secrets.APP_KEY }}
      DB_CONNECTION: sqlite
      DB_DATABASE: database/database.sqlite
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, ctype, iconv, intl, pdo, pdo_sqlite, sqlite3, bcmath, zip
          coverage: none

      - name: Install Composer Dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Prepare Environment & SQLite Database
        run: |
          cp .env.example .env
          touch database/database.sqlite
          if [ -z "$APP_KEY" ]; then
            php artisan key:generate
          fi
          php artisan migrate --force

      - name: Run Laravel Feature & Unit Tests
        run: php artisan test

  build-frontend:
    name: Build Frontend (Vue.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    env:
      VITE_API_BASE_URL: /api

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ./frontend/package-lock.json

      - name: Install Dependencies (npm ci)
        run: npm ci

      - name: Build Production Bundle (npm run build)
        run: npm run build

  deploy:
    name: Build & Push Docker Images to GHCR
    runs-on: ubuntu-latest
    needs: [test-backend, build-frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Lowercase Owner Name for GHCR
        id: owner
        run: echo "name=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Login to GitHub Container Registry (ghcr.io)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Backend Docker Image (Commit SHA Tag)
        run: |
          IMAGE_BACKEND="ghcr.io/${{ steps.owner.outputs.name }}/uts-pl-535644-backend:${{ github.sha }}"
          docker build -t "$IMAGE_BACKEND" ./backend
          docker push "$IMAGE_BACKEND"

      - name: Build and Push Frontend Docker Image (Commit SHA Tag)
        run: |
          IMAGE_FRONTEND="ghcr.io/${{ steps.owner.outputs.name }}/uts-pl-535644-frontend:${{ github.sha }}"
          docker build -t "$IMAGE_FRONTEND" ./frontend
          docker push "$IMAGE_FRONTEND"
